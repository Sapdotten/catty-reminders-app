services:
  app:
    image: ghcr.io/sapdotten/catty-reminders-app:latest
    ports:
      - "8181:8181"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: catty_reminders
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

volumes:
  db_data: