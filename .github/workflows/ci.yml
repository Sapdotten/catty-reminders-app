name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t catty-reminders-app .

      - name: Run server
        run: |
          docker run -d --name app -p 8181:8181 catty-reminders-app
          sleep 5

      - name: Run tests
        run: |
          docker run --rm --network host catty-reminders-app python -m pytest

      - name: Save image to tar
        run: docker save catty-reminders-app > catty-reminders.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v3
        with:
          name: catty-image
          path: catty-reminders.tar