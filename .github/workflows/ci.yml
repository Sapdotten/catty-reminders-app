name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build image
        run: docker build -t catty-reminders-app .

      - name: Run tests
        run: docker run --rm catty-reminders-app python -m pytest