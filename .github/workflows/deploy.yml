name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          rsync -avz --delete . ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/home/user/catty-reminders-app/
          ssh -p 2433 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            echo "🚀 Начинаем развертывание демо-сайта..."
            sudo mkdir -p /home/user/catty-reminders-app
            echo "📁 Копируем файлы сайта..."
            sudo cp -r ./* /home/user/catty-reminders-app/
            source /home/user/catty-reminders-app/venv/bin/activate
            pip install -r /home/user/catty-reminders-app/requirements.txt
            sudo systemctl restart catty-reminders-app.service
            EOF
