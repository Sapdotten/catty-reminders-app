name: Deploy

on:
  push:
    tags: ['*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from same SHA
        uses: actions/download-artifact@v4
        with:
          name: catty-image
          path: .

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2433 ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -p 2433 ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker pull ghcr.io/your-username/catty-reminders-app:latest
            docker stop catty-reminders || true
            docker rm catty-reminders || true
            docker run -d --name catty-reminders -p 80:8181 ghcr.io/your-username/catty-reminders-app:latest
          EOF
