name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: catty-image
          path: .

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2433 ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Transfer image and deploy
        run: |
          scp -P 2433 catty-reminders.tar ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/home/user/
          ssh -p 2433 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            docker stop catty-reminders || true
            docker rm catty-reminders || true
            docker load < /home/user/catty-reminders.tar
            docker run -d --name catty-reminders -p 80:8181 catty-reminders-app
            rm /home/user/catty-reminders.tar
          EOF